packages:
  - playgrounds/*
  - docs

ignoreWorkspaceRootCheck: true
linkWorkspacePackages: true
minimumReleaseAge: 0

# 临时放宽：@nuxt/ui v5 尚未发布到 npm，以 URL 覆盖全部子依赖统一到同一预览包。
# @nuxt/ui v5 发布到 npm 后，移除下方 overrides 中的 @nuxt/ui 并恢复此项为 true
blockExoticSubdeps: false

overrides:
  '@nuxt/ui': https://pkg.pr.new/@nuxt/ui@19681d4
  h3: 1.15.11
  typescript: ^6.0.3

allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: false
  esbuild: false
  sharp: true
  unrs-resolver: false
  vue-demi: false
