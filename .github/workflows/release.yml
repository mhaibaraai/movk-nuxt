name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 重新发布的 tag，如 v0.2.0
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      # Trusted publishing 需要 npm >= 11.5.1；固定 11.x 以避开
      # npm@12 对 Node 版本的 engine 限制（^22.22.2 || ^24.15.0 || >=26）
      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install

      - name: Prepare
        run: pnpm run dev:prepare

      - name: Verify tag matches package version
        id: version
        env:
          REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          TAG="${REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $TAG 与 package.json 版本 $PKG 不一致"
            exit 1
          fi

          case "${PKG%%+*}" in
            *-beta|*-beta.*) DIST_TAG=beta ;;
            *-*) DIST_TAG=next ;;
            *) DIST_TAG=latest ;;
          esac
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pnpm run build

      - name: Pack and verify packaged consumers
        id: package
        run: |
          TARBALL="$RUNNER_TEMP/$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP")"
          pnpm run test:pack "$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        run: npm publish "$TARBALL" --tag "$DIST_TAG" --provenance --access public --ignore-scripts
