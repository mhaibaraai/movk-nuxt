name: CI

on:
  push:
    branches:
      - main
      - v2
  pull_request:
    branches:
      - main
      - v2

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.15.0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: ['22.22.3', '24.15.0', '26.0.0']

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Prepare
        run: pnpm run dev:prepare

      - name: Run lint
        run: pnpm run lint

      - name: Run type check
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test run

      - name: Build
        run: pnpm run build

      - name: Build Vue playground
        run: pnpm run dev:vue:build

      - name: Verify packaged consumers
        run: pnpm run test:pack

      - name: Publish
        if: matrix.node == env.NODE_VERSION
        run: pnpx pkg-pr-new publish --compact --no-template --pnpm

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Prepare
        run: pnpm run dev:prepare

      # AI Chat 随生产产物构建，密钥仅在 Worker 运行时配置
      - name: Build docs
        shell: bash
        env:
          NUXT_GITHUB_TOKEN: ${{ github.token }}
        run: pnpm run docs:build 2>&1 | tee build.log

      - name: Check prerender errors
        run: "! grep '\\[request error\\]' build.log"

      - name: Verify Workers bundle
        run: pnpm --filter @movk/nuxt-docs-site run deploy --dry-run
