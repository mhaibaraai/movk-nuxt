name: 问题反馈
description: 报告 @movk/nuxt 的缺陷
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: '@movk/nuxt 版本'
      placeholder: 1.8.3
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 使用方式
      options:
        - Nuxt 模块
        - Vue + Vite 插件
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: Node.js 版本、包管理器、@nuxt/ui 版本
      placeholder: Node 24.1.0、pnpm 12.15.0、@nuxt/ui 4.12.0
    validations:
      required: true
  - type: input
    id: reproduction
    attributes:
      label: 复现仓库
      description: 最小可复现的仓库或 StackBlitz 链接
      placeholder: https://github.com/...
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 复现步骤、期望行为与实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 构建或运行时的报错输出，粘贴前请移除令牌与密钥
      render: text
